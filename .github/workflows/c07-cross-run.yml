name: C-07 bounded cross-run dispatch to approved C-05
on:
  push:
    branches:
      - qualification/c07-trusted-cross-run-20261024
permissions: {}
concurrency:
  group: c07-trusted-dispatch-${{ github.sha }}
  cancel-in-progress: false
jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[c07-dispatch]') && github.ref == 'refs/heads/qualification/c07-trusted-cross-run-20261024' && vars.GADS_C05_APPROVED_SHA == '43cb1e6924d208288350d70b7b273f7cd3def0c4'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source manifest and fixed-target dispatch negative tests
        run: |
          python3 scripts/qualify.py manifest --checkout .
          python3 -m unittest tests.test_c07_dispatch -v
  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Persist source-bound single-use intent, no dispatch privilege
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c07_dispatch prepare
  dispatch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dispatch approved protected-main C-05, exactly once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c07_dispatch dispatch
  verify:
    needs: dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm genuinely separate GitHub Actions target run without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c07_dispatch verify

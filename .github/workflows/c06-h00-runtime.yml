name: C-06 public synthetic Git-ref CAS recovery
on:
  push:
    branches:
      - qualification/c06-h00-live-20261024
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify bounded source integrity and state transition tests
        run: |
          python3 scripts/qualify.py manifest --checkout .
          python3 -m unittest tests.test_c06_h00 -v
  seed:
    needs: test
    if: contains(github.event.head_commit.message, '[c06-seed]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Persist expired lease then deliberately terminate the runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c06_h00 seed
  recover:
    needs: test
    if: contains(github.event.head_commit.message, '[c06-recover]')
    strategy:
      fail-fast: false
      matrix:
        contender: [alpha, beta]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compete for single terminal CAS transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c06_h00 recover ${{ matrix.contender }}
  verify:
    needs: recover
    if: contains(github.event.head_commit.message, '[c06-recover]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify durable single completion across fresh jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c06_h00 verify
  replay:
    needs: test
    if: contains(github.event.head_commit.message, '[c06-replay]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read terminal state from a third independent run without mutating it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c06_h00 verify

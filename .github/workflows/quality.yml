name: GADS canonical read-only E1
on:
  push:
    branches:
      - development/gads-clean-baseline-v0.2.0-20261025
  pull_request:
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m gads.manifest verify --root .
      - run: python3 -m unittest discover -s tests -v

name: GADS canonical read-only E1
on:
  push:
    branches:
      - development/gads-clean-baseline-v0.2.0-20261025
      - development/gads-trusted-gateway-v0.2.1-20261025
      - development/gads-atomic-cas-v0.2.2-20261025
      - development/gads-writer-authority-v0.2.3-20261025
      - development/gads-trusted-j01-v0.2.4-20261025
      - development/gads-j01-pull-only-v0.2.5-20261025
      - development/gads-sec02-3-parallel-v0.2.6-20261025
      - development/gads-sec02-4-bundle-v0.2.7-20261025
  pull_request:
permissions: {}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify entire tracked source tree
        run: python3 -m gads.manifest verify --root .
      - name: Run deterministic and adversarial E1 tests
        run: python3 -m unittest discover -s tests -v
      - name: Read-only GitHub main and historical-run provenance check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m gads.readonly_probe

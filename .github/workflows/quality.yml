name: Public synthetic E1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned YAML parser in isolated environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r requirements.txt
      - name: Verify complete pinned repository manifest
        run: python3 scripts/qualify.py manifest --checkout .
      - name: Run synthetic positive and negative tests
        run: .ci-venv/bin/python -m unittest discover -s tests -v

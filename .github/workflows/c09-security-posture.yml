name: C-09 read-only security posture gate
on:
  push:
    branches:
      - qualification/c09-trusted-trigger-20261024
permissions: {}
jobs:
  security_posture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate immutable source and negative policy tests
        run: |
          python3 scripts/qualify.py manifest --checkout .
          python3 -m unittest tests.test_c09_posture -v
      - name: Enforce current GitHub protection and branch-code trust
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.c09_posture
